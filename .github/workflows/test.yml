name: test

on:
  push:
  pull_request:

jobs:
  lua:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Lua
        run: sudo apt-get update && sudo apt-get install -y lua5.3

      - name: Syntax check
        run: |
          for f in $(find addons test -name '*.lua'); do
            luac5.3 -p "$f"
          done

      - name: Unit tests
        run: lua5.3 test/run.lua
